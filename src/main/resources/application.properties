spring.application.name=cybercup-backend
server.address=0.0.0.0
server.port=8080

# MySQL Database Connection
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cybercup_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# MySQL Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

security.jwt.secret=${JWT_SECRET}

# Security engine (FastAPI)
ai.engine.base-url=${AI_ENGINE_BASE_URL:http://localhost:8000}
ai.engine.api-key=${ENGINE_API_KEY:}

# Attachments (PDF, Word, pictures) are read by the engine; nothing is written to disk.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# External AI model (Google Gemini). Leave the key empty to use only the local model.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3-flash-preview}
gemini.fallback-model=${GEMINI_FALLBACK_MODEL:gemini-flash-lite-latest}

# Local model (Ollama), used for SECRET documents and when Gemini is unavailable
ollama.base-url=${OLLAMA_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:llama3.2:3b}

# Highest document classification that may be sent to the external AI
gateway.external-max-classification=${EXTERNAL_MAX_CLASSIFICATION:CONFIDENTIAL}

# Frontend origins allowed to call the API
gateway.cors-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost:3000,https://idainakoda.github.io}

# Prompt log: MASKED = keep each prompt with personal data and secrets replaced by placeholders
# (<AADHAAR_1>, <PASSWORD_1>...); NONE = metadata only. Raw prompts are never stored.
gateway.store-prompts=${STORE_PROMPTS:MASKED}
