# Local demo profile: file-based H2 database, no MySQL needed.
# Start with:  --spring.profiles.active=local
spring.datasource.url=jdbc:h2:file:./data/cybercup;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
